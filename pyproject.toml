[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bilkent-stars-cli"
version = "0.2.0"
description = "Unofficial terminal dashboard for Bilkent STARS/SRS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
    "textual==8.2.8",
]

[project.scripts]
srs = "stars_cli:run"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["stars_cli", "stars_client", "stars_presentation", "stars_tui"]
